<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkStrap Engine</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07090d; --panel:#0d1118; --line:#1c2330; --text:#dfe6f0; --dim:#7d8898; --blue:#4c8dff; --good:#46c98b; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Inter, system-ui, sans-serif; }
  .mono { font-family:"JetBrains Mono", monospace; }
  header { display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:16px 24px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; font-weight:800; letter-spacing:.02em; }
  header h1 span { color:var(--blue); }
  .goal { color:var(--dim); flex:1; min-width:200px; }
  button { background:var(--blue); color:#fff; border:0; padding:9px 16px; border-radius:6px; font-weight:600; cursor:pointer; font:inherit; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; cursor:wait; }
  main { display:grid; grid-template-columns:300px 1fr 300px; gap:16px; padding:16px 24px; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; padding:16px; } header { padding:16px; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:2px 0 8px; }
  .bar i { display:block; height:100%; background:var(--blue); }
  .ads { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .ad { border:1px solid var(--line); border-radius:8px; padding:12px; background:#0a0e14; }
  .ad h3 { margin:0 0 6px; font-size:16px; font-weight:800; }
  .ad p { margin:0 0 8px; color:var(--dim); font-size:13px; }
  .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:10px; border:1px solid var(--line); color:var(--dim); margin:0 4px 4px 0; }
  .tag.ok { border-color:var(--blue); color:var(--blue); }
  .tag.win { border-color:var(--good); color:var(--good); } .tag.flop { border-color:var(--bad); color:var(--bad); }
  .react { display:flex; height:8px; border-radius:4px; overflow:hidden; margin:6px 0; }
  .agent { cursor:pointer; color:var(--blue); text-decoration:underline dotted; }
  input, select, textarea { background:#0a0e14; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:8px; font:inherit; width:100%; }
  .dial input { width:80px; padding:3px 6px; }
  .pending { color:var(--blue); font-size:11px; }
  #ascii { color:#2b4a7d; font-size:10px; line-height:1; white-space:pre; overflow:hidden; margin:0; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; max-width:720px; width:92vw; }
  dialog::backdrop { background:#000a; }
  ul.tree { list-style:none; padding-left:16px; border-left:1px dashed var(--line); margin:4px 0; }
  .empty { color:var(--dim); font-style:italic; }
  form.new { display:grid; gap:10px; max-width:560px; margin:40px auto; }
</style>
</head>
<body>
<header>
  <h1><img src="/favicon.png" alt="" width="24" height="24" style="vertical-align:-5px;margin-right:8px;border-radius:6px">MARK<span>STRAP</span> <span class="mono" style="color:var(--dim);font-weight:400">/ campaign engine</span></h1>
  <div class="goal" id="goal"></div>
  <span class="mono" id="term"></span>
  <button id="run">Run generation</button>
  <button class="ghost" id="snap">Snapshot</button>
</header>

<form class="new" id="newForm" hidden>
  <pre id="ascii"></pre>
  <h2>New campaign</h2>
  <textarea name="goal" rows="2" placeholder="Goal, e.g. Make our cake shop in Indiranagar the go-to birthday order for college students" required></textarea>
  <textarea name="market" rows="2" placeholder="Target market, e.g. Bangalore students 18–24, Instagram-heavy, price sensitive" required></textarea>
  <select name="ad_type"><option value="direct">Direct response — sell now</option><option value="brand">Brand — shift minds</option></select>
  <button>Seed population</button>
</form>

<main id="app" hidden>
  <div>
    <section><h2>Population · nature</h2><div id="pop"></div></section>
    <section><h2>Queens · breeders</h2><div id="queens"></div></section>
    <section><h2>Dials</h2><div id="dials"></div></section>
  </div>
  <div>
    <section><h2 id="adsTitle">Ads</h2><div class="ads" id="ads"></div></section>
  </div>
  <div>
    <section><h2>Lessons · nurture</h2><div id="lessons"></div></section>
    <section><h2>Reality → audience memory</h2>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <a href="/api/ads.csv"><button class="ghost" type="button">Shortlist CSV</button></a>
        <label><button class="ghost" type="button" onclick="this.nextElementSibling.click()">Import results</button><input type="file" accept=".csv" id="csv" hidden></label>
      </div>
      <div id="memory"></div></section>
    <section><h2>Audience archetypes</h2><div id="personas"></div></section>
  </div>
</main>

<dialog id="dlg"><div id="dlgBody"></div><form method="dialog"><button class="ghost">Close</button></form></dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (p, o) => fetch(p, o).then(async r => { if (!r.ok) throw new Error(await r.text()); return r.json(); });
const COLORS = {share:"#4c8dff", engage:"#2b5fb8", ignore:"#1c2330", dislike:"#ff6b6b"};
let S;

async function load() {
  S = await api("/api/state");
  const has = !!S.campaign;
  $("newForm").hidden = has; $("app").hidden = !has;
  $("run").disabled = !has || S.busy;
  $("run").textContent = S.busy ? "Evolving…" : "Run generation";
  if (!has) return;
  $("goal").textContent = `${S.campaign.goal} — ${S.campaign.market} · ${S.campaign.ad_type}`;
  $("term").textContent = `TERM ${S.term}`;
  renderPop(); renderQueens(); renderDials(); renderAds(); renderSide();
  if (S.busy) setTimeout(load, 3000);
}

function renderPop() {
  const groups = {};
  for (const a of S.agents) {
    const g = groups[a.breed] ??= {};
    const c = g[a.caste] ??= {alive:0, archived:0, best:null};
    if (a.alive) { c.alive++; if (!c.best || a.fitness > c.best.fitness) c.best = a; } else c.archived++;
  }
  const max = Math.max(...Object.values(groups).flatMap(g => Object.values(g).map(c => c.alive)), 1);
  $("pop").innerHTML = Object.entries(groups).map(([b, g]) => `<div style="margin-bottom:8px"><b>${esc(b)}</b>` +
    Object.entries(g).map(([c, v]) => `<div class="row"><span>${esc(c)}</span><span class="mono">${v.alive} alive · ${v.archived} archived</span></div>
      <div class="bar"><i style="width:${v.alive / max * 100}%"></i></div>
      ${v.best ? `<div class="row" style="font-size:12px"><span>best <span class="agent" data-id="${v.best.id}">${v.best.id}</span></span><span class="mono">${v.best.fitness.toFixed(2)}</span></div>` : ""}`).join("") + "</div>").join("");
}

function renderQueens() {
  $("queens").innerHTML = S.queens.map(q => `<div class="row" style="${q.alive ? "" : "opacity:.4;text-decoration:line-through"}">
    <span class="mono">${esc(q.id)}</span><span>${esc(q.rule)}</span><span class="mono">${(+q.rating).toFixed(2)}${q.poor_terms ? ` ⚠${q.poor_terms}` : ""}</span></div>`).join("");
}

function renderDials() {
  $("dials").innerHTML = Object.entries(S.dials).map(([k, v]) => `<div class="row dial"><span>${esc(k)}${k in S.pending ? ` <span class="pending">→ ${S.pending[k]} next term</span>` : ""}</span>
    <input class="mono" data-dial="${esc(k)}" value="${v}"></div>`).join("");
}

function renderAds() {
  const latest = S.ads.filter(a => a.term === S.term);
  $("adsTitle").textContent = `Ads · term ${S.term} · simulation filters, reality judges`;
  $("ads").innerHTML = latest.length ? latest.map(a => {
    const c = a.content, n = {share:0, engage:0, ignore:0, dislike:0};
    (a.reactions || []).forEach(r => n[r.reaction] = (n[r.reaction] || 0) + 1);
    const tot = Object.values(n).reduce((x, y) => x + y, 0) || 1;
    const why = (a.reactions || []).slice(0, 2).map(r => `<div style="font-size:12px;color:var(--dim)">“${esc(r.parts?.copy?.why)}” — ${esc(r.persona)}</div>`).join("");
    const real = a.real_score == null ? "" : `<span class="tag ${a.real_score > 0 ? "win" : "flop"}">real ${a.real_score.toFixed(2)}</span>`;
    return `<div class="ad">
      <span class="tag">${esc(c.platform)}</span><span class="tag">${esc(a.style)}</span>${a.shortlisted ? '<span class="tag ok">shortlisted</span>' : '<span class="tag">demoted</span>'}${real}
      <h3>${esc(c.headline)}</h3><p>${esc(c.body)}</p>
      <p class="mono" style="font-size:12px">▣ ${esc(c.visual)}</p>
      <p style="font-size:12px">font: ${esc(c.font)} · ${esc(c.post_time)}</p>
      <div class="row"><span>sim score</span><span class="mono">${a.sim_score.toFixed(2)}</span></div>
      <div class="react">${Object.entries(n).map(([k, v]) => `<i title="${k}: ${v}" style="width:${v / tot * 100}%;background:${COLORS[k]}"></i>`).join("")}</div>
      <div style="font-size:11px;color:var(--dim)" class="mono">${Object.entries(n).map(([k, v]) => `${k} ${v}`).join(" · ")}</div>
      ${why}
      <div style="font-size:12px;margin-top:6px">team: ${a.team.map(m => `<span class="agent" data-id="${m.id}">${esc(m.breed)}</span>`).join(", ")}</div>
      <div class="mono" style="font-size:10px;color:var(--dim);margin-top:4px">${a.id}</div>
    </div>`;
  }).join("") : `<div class="empty">No ads yet — run a generation.</div>`;
}

function renderSide() {
  const L = Object.entries(S.lessons);
  $("lessons").innerHTML = L.length ? L.map(([k, v]) => `<div style="margin-bottom:8px"><b>${esc(k)}</b><div style="color:var(--dim);font-size:13px">${esc(v.at(-1))}</div></div>`).join("") : `<div class="empty">Castes learn from their best ad from term 2 on.</div>`;
  $("memory").innerHTML = S.memory.length ? S.memory.map(m => `<div style="margin-bottom:6px;font-size:13px"><span class="tag ${m.kind}">${m.kind}</span>${esc(m.text)}</div>`).join("") : `<div class="empty">Post shortlisted ads, then import real results. Flops cool similar ideas.</div>`;
  $("personas").innerHTML = S.personas.map(p => `<div style="font-size:13px;margin-bottom:6px"><b>${esc(p.name)}</b> <span style="color:var(--dim)">${esc(p.habits)}</span><div style="font-size:12px">${(p.tendencies || []).map(esc).join(" ")}</div></div>`).join("");
}

function tree(a) {
  if (!a) return "";
  const kids = a.parent_tree.filter(Boolean);
  return `<li><span class="mono">${esc(a.id)}</span> <span class="tag">${esc(a.caste)}</span><span class="tag">${esc(a.child_kind)}</span>${a.alive ? "" : '<span class="tag flop">archived</span>'} fit ${a.fitness.toFixed(2)} · born t${a.born}
    <div style="color:var(--dim);font-size:12px">${esc(a.genome.prompt)}</div>${kids.length ? `<ul class="tree">${kids.map(tree).join("")}</ul>` : ""}</li>`;
}

document.addEventListener("click", async e => {
  const id = e.target.dataset?.id;
  if (!id) return;
  const a = await api(`/api/lineage/${id}`);
  $("dlgBody").innerHTML = `<h2>Lineage</h2><ul class="tree" style="border:0;padding:0">${tree(a)}</ul>
    ${a.alive ? "" : `<button onclick="api('/api/revive/${a.id}',{method:'POST'}).then(()=>{$('dlg').close();load()})">Revive from archive</button>`}`;
  $("dlg").showModal();
});

document.addEventListener("change", async e => {
  const k = e.target.dataset?.dial;
  if (!k) return;
  await api("/api/dial", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:k, value:+e.target.value})});
  load();
});

$("run").onclick = async () => {
  $("run").disabled = true; $("run").textContent = "Evolving…";
  const p = api("/api/generation", {method:"POST"}).catch(err => alert(err.message));
  setTimeout(load, 1000); await p; load();
};
$("snap").onclick = async () => { const r = await api("/api/snapshot", {method:"POST"}); $("snap").textContent = `Saved ${r.id}`; };
$("csv").onchange = async e => {
  const fd = new FormData(); fd.append("file", e.target.files[0]);
  await api("/api/results", {method:"POST", body:fd}); load();
};
$("newForm").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  e.target.querySelector("button").textContent = "Seeding audience…";
  await api("/api/campaign", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(f)});
  load();
};

// ASCII strings: human direction above, agent execution below
$("ascii").textContent = Array.from({length:7}, (_, y) => Array.from({length:72}, (_, x) => ((x * 7 + y * 13) % 11 === 0 ? "│" : (x + y) % 9 === 0 ? "·" : " ")).join("")).join("\n");
load();
</script>
</body>
</html>
