services:
  engine:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
    volumes: ["./data:/app/data", "./config.yaml:/app/config.yaml:ro", "./secrets:/app/secrets:ro"]
    depends_on: [falkordb]

  # Graph DB behind Graphiti (audience memory). Browser UI on :3000.
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]
    volumes: ["falkordb:/data"]

volumes:
  falkordb:
